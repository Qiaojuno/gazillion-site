<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gazillion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0B1526; --panel: #13233D; --ink: #E8F1FF; --dim: #A9B6C8; --gold: #FFD166; --line: #2B4870; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  header { background: linear-gradient(#0C6AC7, #13233D); padding: 40px 16px 28px; text-align: center; }
  header a { font-family: "VT323", monospace; font-size: clamp(40px, 13vw, 64px); letter-spacing: 0.06em; color: var(--ink);
             text-decoration: none; text-shadow: 3px 3px 0 #162F5E; }
  header p { margin: 4px 0 0; font-family: "VT323", monospace; font-size: clamp(16px, 5vw, 22px); color: var(--gold); letter-spacing: 0.12em; }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-family: "VT323", monospace; font-size: clamp(30px, 9vw, 40px); line-height: 1.1; font-weight: 400; color: var(--gold); margin: 8px 0 4px; }
  h2 { font-family: "VT323", monospace; font-size: 30px; font-weight: 400; color: var(--gold); margin: 36px 0 8px;
       border-bottom: 1px solid var(--line); padding-bottom: 4px; }
  h3 { font-size: 18px; margin: 24px 0 4px; }
  p, li { color: var(--ink); }
  .meta { color: var(--dim); margin-top: 0; }
  a { color: var(--gold); }
  ul { padding-left: 22px; }
  nav { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 24px; }
  nav a { display: block; flex: 1 1 200px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
          padding: 18px; text-decoration: none; font-family: "VT323", monospace; font-size: 28px; text-align: center; }
  footer { color: var(--dim); text-align: center; font-size: 14px; padding: 0 16px 40px; }
</style>
</head>
<body>
<header><a href="./">GAZILLION</a><p>RARE ANSWERS FLY HIGHER</p></header>
<main>
<h1>Gazillion</h1>
<p>A word game where rare answers fly higher. Name the answer nobody else thinks of and watch your bird climb.</p>
<nav><a href="support/">Support</a><a href="privacy/">Privacy Policy</a></nav>
</main>
<footer>Gazillion · <a href="./privacy/">Privacy</a> · <a href="./support/">Support</a></footer>
</body>
</html>
